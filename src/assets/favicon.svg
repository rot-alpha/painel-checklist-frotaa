<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#162744"/>
      <stop offset="100%" stop-color="#0A1520"/>
    </radialGradient>
    <clipPath id="rounded">
      <rect width="512" height="512" rx="110" ry="110"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" ry="110" fill="url(#bg)"/>

  <!-- ===== FIORINO SILHOUETTE ===== -->
  <g clip-path="url(#rounded)" fill="#FF6B1A">

    <!-- Main body: boxy van shape -->
    <path d="
      M 68 315
      L 68 290
      Q 68 275 78 268
      L 100 258
      Q 112 235 135 222
      L 175 212
      Q 188 208 205 208
      L 390 208
      Q 408 208 418 220
      L 432 240
      Q 442 252 444 268
      L 444 315
      Z
    "/>

    <!-- Cabin window cut (dark) — front cab area -->
    <path d="
      M 120 258
      Q 128 238 148 226
      L 198 216
      L 198 258
      Z
    " fill="#0A1520"/>

    <!-- Sliding door window cut (dark) -->
    <rect x="210" y="218" width="80" height="48" rx="5" fill="#0A1520"/>

    <!-- Rear cargo panel — solid (no window) — already part of body -->

    <!-- Front bumper detail -->
    <rect x="68" y="295" width="28" height="22" rx="4" fill="#0A1520"/>

    <!-- Windshield pillar line (A-pillar) -->
    <rect x="198" y="208" width="8" height="60" rx="2" fill="#0A1520"/>

    <!-- B-pillar -->
    <rect x="290" y="208" width="8" height="70" rx="2" fill="#0A1520"/>

  </g>

  <!-- Rear wheel -->
  <circle cx="378" cy="322" r="42" fill="#FF6B1A"/>
  <circle cx="378" cy="322" r="24" fill="#0A1520"/>

  <!-- Front wheel (hidden behind badge, draw partial) -->
  <circle cx="150" cy="322" r="42" fill="#FF6B1A"/>
  <circle cx="150" cy="322" r="24" fill="#0A1520"/>

  <!-- ===== CHECKMARK BADGE (overlaps front wheel) ===== -->
  <!-- Outer filled circle (navy) -->
  <circle cx="150" cy="322" r="68" fill="#0D1B2A"/>
  <!-- Blue ring -->
  <circle cx="150" cy="322" r="68" fill="none" stroke="#00A8FF" stroke-width="13"/>
  <!-- White checkmark -->
  <polyline
    points="116,322 140,348 188,296"
    fill="none"
    stroke="white"
    stroke-width="17"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
